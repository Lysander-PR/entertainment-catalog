name: Docker Image CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# permissions:
#   contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git Semantic Version
        uses: PaulHatch/semantic-version@v5.4.0
        id: version
        with:
          major_pattern: 'major:'
          minor_pattern: 'feat:'
          version_format: '${major}.${minor}.${patch}'

      # - name: Create and push git tag
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}" || echo "Tag already exists"
      #     git push origin "v${{ steps.version.outputs.version }}" || true

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_NAME: 'entertainments'
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.NEW_VERSION }}
            ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest
