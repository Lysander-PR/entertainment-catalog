<svg width="900" height="610" viewBox="0 0 900 610" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Entertainment Catalog API architecture</title>
<desc>A client calls the Entertainment Catalog API (NestJS), which runs requests through a pipeline (JWT guard, validation, cache interceptor) into domain services for movies, books, albums, songs, genres and users, then reads/writes PostgreSQL, Redis, and Supabase storage.</desc>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .title { font-size: 22px; font-weight: 700; }
  .boxtitle { font-size: 19px; font-weight: 700; }
  .item { font-size: 16px; font-weight: 400; }
  .sub { font-size: 15px; font-weight: 400; }
</style>
<rect width="900" height="610" fill="#FFFFFF"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#7A7568" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Client -->
<rect x="340" y="20" width="220" height="70" rx="14" fill="#EDE8DD" stroke="#A39C8C" stroke-width="1"/>
<text class="title" x="450" y="53" text-anchor="middle" fill="#3A362E">Client</text>
<text class="sub" x="450" y="76" text-anchor="middle" fill="#6B6558">Postman, app, etc.</text>

<line x1="450" y1="90" x2="450" y2="130" stroke="#7A7568" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Outer container -->
<rect x="60" y="130" width="780" height="340" rx="24" fill="#EDE8DD" stroke="#A39C8C" stroke-width="1"/>
<text class="title" x="90" y="172" fill="#3A362E">Entertainment Catalog API (NestJS)</text>

<!-- Request pipeline -->
<rect x="100" y="215" width="330" height="220" rx="16" fill="#FFFEF7" stroke="#D8D3C0" stroke-width="1"/>
<text class="boxtitle" x="265" y="255" text-anchor="middle" fill="#1F1E1B">Request pipeline</text>
<text class="item" x="265" y="300" text-anchor="middle" fill="#4A473F">Guard: JWT + roles</text>
<text class="item" x="265" y="334" text-anchor="middle" fill="#4A473F">ValidationPipe: DTOs</text>
<text class="item" x="265" y="368" text-anchor="middle" fill="#4A473F">CacheInterceptor: GET</text>

<!-- Domain services -->
<rect x="470" y="215" width="330" height="220" rx="16" fill="#E3E0FB" stroke="#B7B0F0" stroke-width="1"/>
<text class="boxtitle" x="635" y="255" text-anchor="middle" fill="#3B2F87">Domain services</text>
<text class="item" x="635" y="300" text-anchor="middle" fill="#5A4FB0">Movies, books, albums</text>
<text class="item" x="635" y="334" text-anchor="middle" fill="#5A4FB0">Songs, genres, users</text>
<text class="item" x="635" y="368" text-anchor="middle" fill="#5A4FB0">Business rules + DTOs</text>

<line x1="430" y1="325" x2="468" y2="325" stroke="#7A7568" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Data tier -->
<rect x="65" y="520" width="230" height="70" rx="14" fill="#FFFEF7" stroke="#D8D3C0" stroke-width="1"/>
<text class="boxtitle" x="180" y="562" text-anchor="middle" fill="#1F1E1B">PostgreSQL</text>

<rect x="335" y="520" width="230" height="70" rx="14" fill="#FFFEF7" stroke="#D8D3C0" stroke-width="1"/>
<text class="boxtitle" x="450" y="562" text-anchor="middle" fill="#1F1E1B">Redis (cache)</text>

<rect x="605" y="520" width="230" height="70" rx="14" fill="#FFFEF7" stroke="#D8D3C0" stroke-width="1"/>
<text class="boxtitle" x="720" y="562" text-anchor="middle" fill="#1F1E1B">Supabase storage</text>

<line x1="180" y1="470" x2="180" y2="520" stroke="#7A7568" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450" y1="470" x2="450" y2="520" stroke="#7A7568" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="720" y1="470" x2="720" y2="520" stroke="#7A7568" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
